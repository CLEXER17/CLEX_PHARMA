services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clex_pharma
      POSTGRES_USER: clex
      POSTGRES_PASSWORD: clex
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clex -d clex_pharma"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://clex:clex@db:5432/clex_pharma
      PROCESS_ROLE: web
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: python -m app.scheduler.worker
    environment:
      DATABASE_URL: postgresql+psycopg://clex:clex@db:5432/clex_pharma
      PROCESS_ROLE: worker
    depends_on:
      db:
        condition: service_healthy
