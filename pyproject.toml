[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clex-pharma"
version = "0.1.0"
description = "All-India B.Pharm career intelligence Telegram bot"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "feedparser==6.0.11",
  "selectolax==0.3.26",
  "python-dateutil==2.9.0.post0",
  "rapidfuzz==3.11.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.4", "pytest-asyncio==0.25.0", "respx==0.22.0"]
dev = ["ruff==0.9.2", "mypy==1.14.1", "types-python-dateutil==2.9.0.20241206"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
